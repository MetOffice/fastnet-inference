name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Checking lock file consistency with 'pyproject.toml'
        run: uv lock --locked

      - name: Linting via pre-commit
        run: uv run --dev pre-commit run -a

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Remove lockfile for library testing
        run: rm uv.lock

      - name: Run tests (excluding HF-dependent integration tests)
        run: uv run --all-extras pytest tests -m "not requires_hf"

  tests-locked:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Run tests using lockfile (excluding HF-dependent integration tests)
        run: uv run --locked --all-extras pytest tests -m "not requires_hf"

  hf-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Run Hugging Face Hub integration tests
        run: uv run --locked --all-extras pytest tests -m "requires_hf"
